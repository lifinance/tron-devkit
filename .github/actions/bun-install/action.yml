# Bun install (composite action)
# - Installs Bun and Node.js (LTS), then runs a frozen lockfile install
# - Use from workflows that need the repo toolchain before build or test steps

name: 'Bun install'
description: 'Run bun install with cache enabled'

runs:
  using: 'composite'
  steps:
    - name: Set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: lts/*
        registry-url: 'https://registry.npmjs.org'
    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
